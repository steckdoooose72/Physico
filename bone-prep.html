<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physico – Bone-Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/farben.css?v=2">
  <link rel="stylesheet" href="css/quiz.css?v=4">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Die 3D-Bühne füllt das Fenster, alles andere liegt darüber -->
  <div id="buehne"></div>

  <!-- Kopfzeile: Rückweg, Titel, Fortschritt -->
  <header id="quiz-kopf">
    <a class="zurueck" href="vorbereitung.html">← Vorbereitung</a>
    <div class="kopf-mitte">
      <span class="kopf-titel">Bone-Prep</span>
      <span class="kopf-untertitel" id="kopf-einstellungen"></span>
    </div>
    <div class="fortschritt">
      <span id="fortschritt-text">–</span>
      <div class="fortschritt-balken"><div id="fortschritt-fuell"></div></div>
    </div>
  </header>

  <!-- Frage mit Antwortmöglichkeiten. Bewusst ohne Rückmeldung: ob die Antwort
       stimmt, steht erst in der Auswertung am Ende der Runde. -->
  <section id="frage-bereich" hidden>
    <p class="frage-text" id="frage-text">Welcher Knochen ist hervorgehoben?</p>
    <div class="antworten" id="antworten"></div>
  </section>

  <!-- Auswertung am Ende -->
  <section id="ergebnis" hidden>
    <h2 id="ergebnis-titel"></h2>
    <p class="ergebnis-zahl" id="ergebnis-zahl"></p>
    <div id="ergebnis-fehler"></div>
    <div class="ergebnis-knoepfe">
      <button type="button" class="weiter-knopf" id="fehler-knopf" hidden>Fehler üben</button>
      <button type="button" class="weiter-knopf" id="nochmal-knopf">Noch eine Runde</button>
      <a class="text-knopf" href="vorbereitung.html">Zurück zur Vorbereitung</a>
    </div>
  </section>

  <div id="ladehinweis">Bone-Prep startet …</div>

  <script type="module" src="js/bone-prep.js?v=14"></script>
</body>
</html>
