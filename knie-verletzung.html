<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membra – Verletzungsmechanismus Knie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/farben.css?v=2">
  <link rel="stylesheet" href="css/quiz.css?v=5">

  <!-- Pilotseite: das Aussehen kommt aus quiz.css, hier stehen nur die paar
       Ergänzungen, die es dort noch nicht gibt (Situationstext, Strukturliste
       in der Auswertung). Bewusst inline, damit der Pilot nichts Bestehendes
       anfasst. Identisch zu schulter-verletzung.html. -->
  <style>
    /* Der Situationstext ist deutlich länger als eine Knochenfrage –
       er bekommt deshalb mehr Raum und die Serifenschrift. */
    .situation {
      margin: 0 0 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17px;
      line-height: 1.5;
      color: var(--olive-dunkel);
    }

    .situation-marke {
      display: block;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--graugruen-dunkel);
    }

    /* Antworten sind hier einzelne Begriffe, keine zwei Namen übereinander */
    #antworten .antwort-knopf { flex-direction: row; justify-content: center; }

    /* Auswertung: die Strukturen der Runde zum Nachsehen im Modell */
    .strukturliste { margin: 0; padding: 0; list-style: none; text-align: left; }

    .strukturliste li {
      padding: 6px 0;
      border-bottom: 1px solid var(--rand);
    }
    .strukturliste li:last-child { border-bottom: none; }

    .struktur-knopf {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 4px 0;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--olive-dunkel);
      text-align: left;
      cursor: pointer;
    }
    .struktur-knopf:hover:not(:disabled) { color: var(--olive-text); }
    .struktur-knopf:disabled { cursor: default; color: var(--text-leise); }
    .struktur-knopf:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }

    .struktur-vermerk { flex-shrink: 0; font-size: 12px; color: var(--text-leise); }
    .struktur-vermerk.gepatzt { color: var(--falsch); }

    /* Hinweis unter einer Frage in der Auswertung (z. B. „Unhappy Triad") */
    .struktur-hinweis {
      margin: 2px 0 0;
      font-size: 12px;
      font-style: italic;
      color: var(--text-leise);
    }

    /* Schmale Leiste beim Nachsehen einer Struktur – die Auswertung ist so
       groß, dass sie das Modell sonst verdeckt. */
    #ansicht-leiste {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 18px;
      width: min(560px, calc(100% - 32px));
      padding: 14px 20px;
      background: var(--panel);
      border: 1px solid var(--rand);
      border-radius: 16px 14px 16px 12px;
      box-shadow: var(--schatten-fern);
      backdrop-filter: blur(10px);
    }
    #ansicht-leiste[hidden] { display: none; }

    #ansicht-name {
      flex: 1;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--olive-dunkel);
    }

    #ansicht-zurueck { margin-top: 0; flex-shrink: 0; }

    /* --- Umfangswahl vor der ersten Frage ------------------------------- */
    #start-bereich {
      position: fixed;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100% - 32px));
      padding: 32px;
      background: var(--panel-hell);
      border: 1px solid var(--rand);
      border-radius: 22px 18px 20px 16px;
      box-shadow: var(--schatten-fern);
      text-align: center;
    }
    #start-bereich[hidden] { display: none; }

    #start-bereich h2 {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--olive-dunkel);
    }

    .start-einleitung {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-leise);
    }

    .start-wahl { display: flex; flex-direction: column; gap: 12px; }

    .start-knopf {
      padding: 16px 20px;
      background: var(--papier-hell);
      border: 1px solid var(--rand);
      border-radius: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .start-knopf:hover { transform: translateY(-2px); border-color: var(--olive); }
    .start-knopf:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }

    .start-knopf b {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--olive-dunkel);
    }
    .start-knopf span {
      display: block;
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--text-leise);
    }

    /* .text-knopf ist in quiz.css für Links gedacht – als Knopf braucht es
       den Button-Grundzustand zurück. */
    button.text-knopf {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Die 3D-Bühne füllt das Fenster, alles andere liegt darüber -->
  <div id="buehne"></div>

  <!-- Kopfzeile: Rückweg, Titel, Fortschritt -->
  <header id="quiz-kopf">
    <a class="zurueck" href="index.html">← Startseite</a>
    <div class="kopf-mitte">
      <span class="kopf-titel">Verletzungsmechanismus</span>
      <span class="kopf-untertitel" id="kopf-umfang">Knie · Pilot</span>
    </div>
    <div class="fortschritt">
      <span id="fortschritt-text">–</span>
      <div class="fortschritt-balken"><div id="fortschritt-fuell"></div></div>
    </div>
    <button type="button" class="beenden-knopf" id="beenden-knopf">Beenden</button>
  </header>

  <!-- Umfangswahl: echte Trennung statt eines Etiketts an der einzelnen Frage -->
  <section id="start-bereich" hidden>
    <h2>Verletzungsmechanismus</h2>
    <p class="start-einleitung">
      Eine Situation wird beschrieben – welche Struktur ist am ehesten betroffen?
    </p>
    <div class="start-wahl">
      <button type="button" class="start-knopf" id="einstieg-knopf">
        <b>Einstieg</b>
        <span>Die vier eindeutigen Verletzungsmechanismen.</span>
      </button>
      <button type="button" class="start-knopf" id="vertiefung-knopf">
        <b>Vertiefung</b>
        <span>Alle sieben Situationen, auch die feineren.</span>
      </button>
    </div>
  </section>

  <!-- Situation mit Antwortmöglichkeiten. Wie in Bone-Prep bewusst ohne
       Rückmeldung: ob die Antwort stimmt, steht erst in der Auswertung.
       Die 3D-Szene zeigt währenddessen nur die Knieregion, nie die Lösung. -->
  <section id="frage-bereich" hidden>
    <p class="situation" id="situation">
      <span class="situation-marke">Situation</span>
      <span id="situation-text"></span>
    </p>
    <div class="antworten" id="antworten"></div>
  </section>

  <!-- Auswertung am Ende -->
  <section id="ergebnis" hidden>
    <h2 id="ergebnis-titel"></h2>
    <p class="ergebnis-zahl" id="ergebnis-zahl"></p>
    <div id="ergebnis-fehler"></div>
    <div class="ergebnis-knoepfe">
      <button type="button" class="weiter-knopf" id="nochmal-knopf">Noch eine Runde</button>
      <button type="button" class="text-knopf" id="umfang-knopf">Anderer Umfang</button>
      <a class="text-knopf" href="index.html">Zurück zur Startseite</a>
    </div>
  </section>

  <!-- Beim Nachsehen einer Struktur tritt die Auswertung beiseite, damit das
       Modell frei liegt – hier steht dann nur noch, was gerade leuchtet. -->
  <section id="ansicht-leiste" hidden>
    <span id="ansicht-name"></span>
    <button type="button" class="weiter-knopf" id="ansicht-zurueck">Zurück zur Auswertung</button>
  </section>

  <div id="ladehinweis">Knie-Pilot startet …</div>

  <script type="module" src="js/knie-verletzung.js?v=2"></script>
</body>
</html>
