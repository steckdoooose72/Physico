<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membra – Alltagsbewegungen der Schulter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/farben.css?v=2">
  <link rel="stylesheet" href="css/quiz.css?v=5">

  <!-- Pilotseite: das Aussehen kommt aus quiz.css, hier stehen nur die
       Ergänzungen, die es dort noch nicht gibt (Umfangswahl, Bewegungstext,
       Funktionszeile). Bewusst inline, damit der Pilot nichts Bestehendes
       anfasst. Identisch zu schulter-bewegung.html. -->
  <style>
    /* --- Umfangswahl vor der ersten Frage ------------------------------- */
    #start-bereich {
      position: fixed;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100% - 32px));
      padding: 32px;
      background: var(--panel-hell);
      border: 1px solid var(--rand);
      border-radius: 22px 18px 20px 16px;
      box-shadow: var(--schatten-fern);
      text-align: center;
    }
    #start-bereich[hidden] { display: none; }

    #start-bereich h2 {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--olive-dunkel);
    }

    .start-einleitung {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-leise);
    }

    .start-wahl { display: flex; flex-direction: column; gap: 12px; }

    .start-knopf {
      padding: 16px 20px;
      background: var(--papier-hell);
      border: 1px solid var(--rand);
      border-radius: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .start-knopf:hover { transform: translateY(-2px); border-color: var(--olive); }
    .start-knopf:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }

    .start-knopf b {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--olive-dunkel);
    }
    .start-knopf span {
      display: block;
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--text-leise);
    }

    /* --- Frage ---------------------------------------------------------- */
    /* Der Bewegungstext ist länger als ein Strukturname und bekommt deshalb
       die Serifenschrift und mehr Raum. */
    .bewegung {
      margin: 0 0 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17px;
      line-height: 1.5;
      color: var(--olive-dunkel);
    }

    .bewegung-marke {
      display: block;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--graugruen-dunkel);
    }

    /* Antworten sind hier einzelne Muskelnamen, keine zwei Namen übereinander */
    #antworten .antwort-knopf { flex-direction: row; justify-content: center; }

    /* Erscheint erst nach der Antwort – währenddessen bleibt der Muskel im
       Modell hervorgehoben, damit Text und Bild zusammen ankommen. */
    #funktion {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--rand);
      text-align: left;
    }
    #funktion[hidden] { display: none; }

    .funktion-marke {
      display: block;
      margin-bottom: 6px;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--graugruen-dunkel);
    }

    .funktion-text {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 15.5px;
      line-height: 1.5;
      color: var(--olive-dunkel);
    }

    /* .text-knopf ist in quiz.css für Links gedacht – als Knopf braucht es
       den Button-Grundzustand zurück. */
    button.text-knopf {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Die 3D-Bühne füllt das Fenster, alles andere liegt darüber -->
  <div id="buehne"></div>

  <!-- Kopfzeile: Rückweg, Titel, Fortschritt -->
  <header id="quiz-kopf">
    <a class="zurueck" href="index.html">← Startseite</a>
    <div class="kopf-mitte">
      <span class="kopf-titel">Alltagsbewegungen der Schulter</span>
      <span class="kopf-untertitel" id="kopf-umfang">Schulter · Pilot</span>
    </div>
    <div class="fortschritt">
      <span id="fortschritt-text">–</span>
      <div class="fortschritt-balken"><div id="fortschritt-fuell"></div></div>
    </div>
    <button type="button" class="beenden-knopf" id="beenden-knopf">Beenden</button>
  </header>

  <!-- Umfangswahl: echte Trennung statt eines Etiketts an der einzelnen Frage -->
  <section id="start-bereich" hidden>
    <h2>Alltagsbewegungen der Schulter</h2>
    <p class="start-einleitung">
      Eine Alltagsbewegung wird beschrieben – welcher Muskel führt sie aus?
    </p>
    <div class="start-wahl">
      <button type="button" class="start-knopf" id="einstieg-knopf">
        <b>Einstieg</b>
        <span>Die vier Hauptbewegungen der Schulter.</span>
      </button>
      <button type="button" class="start-knopf" id="vertiefung-knopf">
        <b>Vertiefung</b>
        <span>Alle sieben Bewegungen, auch die feineren.</span>
      </button>
    </div>
  </section>

  <!-- Frage mit Antwortmöglichkeiten. Wie in den anderen Piloten ohne
       Rückmeldung: ob die Antwort stimmt, steht erst in der Auswertung. Nach
       der Antwort erscheint die Funktionszeile – der Muskel bleibt so lange
       im Modell hervorgehoben. -->
  <section id="frage-bereich" hidden>
    <p class="bewegung">
      <span class="bewegung-marke">Alltagsbewegung</span>
      <span id="bewegung-text"></span>
    </p>
    <div class="antworten" id="antworten"></div>

    <div id="funktion" hidden>
      <span class="funktion-marke">Funktion</span>
      <p class="funktion-text" id="funktion-text"></p>
    </div>

    <button type="button" class="weiter-knopf" id="weiter-knopf" hidden>Weiter</button>
  </section>

  <!-- Auswertung am Ende -->
  <section id="ergebnis" hidden>
    <h2 id="ergebnis-titel"></h2>
    <p class="ergebnis-zahl" id="ergebnis-zahl"></p>
    <div id="ergebnis-fehler"></div>
    <div class="ergebnis-knoepfe">
      <button type="button" class="weiter-knopf" id="nochmal-knopf">Noch eine Runde</button>
      <button type="button" class="text-knopf" id="umfang-knopf">Anderer Umfang</button>
      <a class="text-knopf" href="index.html">Zurück zur Startseite</a>
    </div>
  </section>

  <div id="ladehinweis">Schulter-Alltagsbewegungen starten …</div>

  <script type="module" src="js/schulter-alltag.js?v=1"></script>
</body>
</html>
